# The same checks AGENTS.md requires before any change is done, plus the
# production build (which also builds the service worker).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commits, like the npm dependencies are pinned
      # to exact versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version in package.json's packageManager field.
      # pnpm 12 is a native executable: it needs no Node.js to start.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      # Also downloads the Node.js version pinned by devEngines.runtime, which
      # every script below runs on. The lockfile is checked against the
      # supply-chain settings in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
