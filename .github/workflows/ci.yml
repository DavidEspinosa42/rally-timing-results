# Typecheck, lint and tests, plus the production build (which also builds
# the service worker).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commits, like the npm dependencies are pinned
      # to exact versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The lowest Node.js that devEngines in package.json accepts (it bundles
      # npm 10.9.2), so CI checks the oldest supported setup.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm

      # Installs exactly what package-lock.json lists. .npmrc keeps dependency
      # install scripts from running.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
